<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PJSK LOUNGE</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background-color: #383838;
      color: #ffffff;
    }
    #app {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      background-color: #2a2a2a;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 2em;
      margin-bottom: 20px;
      text-align: center;
    }
    .controls {
      margin-bottom: 15px;
      text-align: center;
    }
    input {
      padding: 5px;
      width: 80%;
      max-width: 400px;
      border: none;
      border-radius: 4px;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th {
      padding: 10px;
      background-color: #030050 !important;
      text-align: center;
    }
    td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #555;
    }
    tbody tr:nth-child(odd)  { background-color: #333; }
    tbody tr:nth-child(even) { background-color: #2a2a2a; }

    .flag {
      width: 24px;
      vertical-align: middle;
      margin-left: 8px;
    }

    .rank-Placement { color: #ff7000 !important; }
    .rank-Bronze    { color: #66311e; }
    .rank-Gold      { color: #ffaf00; }
    .rank-Diamond   { color: #0080ff; }
  </style>
</head>
<body>
  <div id="app">
    <h1>PJSK LOUNGE – <span id="season">Cargando temporada…</span></h1>
    <p id="season-date" style="text-align:center"></p>
    <div class="controls">
      <label for="search">Buscar jugador</label><br>
      <input id="search" type="search" maxlength="100" placeholder="Buscar por nombre…">
    </div>
    <p id="status" role="status" aria-live="polite">Cargando clasificación…</p>
    <table>
      <thead><tr><th scope="col">#</th><th scope="col">Player</th><th scope="col">MMR</th><th scope="col">Rango</th></tr></thead>
      <tbody id="players"></tbody>
    </table>
    <div class="controls">
      <button id="previous" type="button" disabled>Anterior</button>
      <span id="page"></span>
      <button id="next" type="button" disabled>Siguiente</button>
    </div>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
